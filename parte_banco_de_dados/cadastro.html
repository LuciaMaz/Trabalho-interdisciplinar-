<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Alunos</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <img src="imagem-de-fundo-tela-de-senha.jpeg" alt="Fundo" class="background">

    <header class="topo">
        <img src="imagem logo alberto.png" alt="Logo" class="logo">
        <div class="titulo">
            <h1>Colégio Estadual Alberto de Carvalho</h1>
            <p>Portfólios - Téc desenvolvimento de sistemas</p>
        </div>
    </header>

    <main class="cadastro-container">
        <h2>CRIAR CONTA</h2>
        <p>Preencha os campos abaixo para se cadastrar</p>

        <form id="formCadastro">
            <label for="usuario">Escolha um Login:</label>
            <input type="text" id="usuario" placeholder="Ex: nome.sobrenome" required>

            <label for="senha">Escolha uma Senha:</label>
            <input type="password" id="senha" placeholder="Crie uma senha..." required>

            <label for="portfolio">Portfólio do aluno:</label>
            <select id="portfolio" required>
                <option value="">Selecione...</option>
                <option value="amariles">Amariles</option>
                <option value="ana">Ana</option>
                <option value="anny">Anny</option>
                <option value="bruno">Bruno</option>
                <option value="eduarda">Eduarda</option>
                <option value="fernanda">Fernanda</option>
                <option value="gustavo">Gustavo</option>
                <option value="henrique">Henrique</option>
                <option value="jeferson">Jeferson</option>
                <option value="leonardo">Leonardo</option>
                <option value="luan">Luan</option>
                <option value="lucas">Lucas</option>
                <option value="monica">Mônica</option>
                <option value="nathaly">Nathaly</option>
                <option value="nayla">Nayla</option>
                <option value="paulo">Paulo</option>
                <option value="pedro">Pedro</option>
                <option value="rafaelly">Rafaelly</option>
                <option value="renilson">Renilson</option>
                <option value="samara">Samara</option>
                <option value="samira">Samira</option>
                <option value="wendel">Wendel</option>
                <option value="yasmin">Yasmin</option>
            </select>
        
            <button type="submit">Cadastrar</button>
        </form>

        <p id="voltar-login"><a href="login_estudante.html">Já tenho uma conta</a></p>
    </main>

    <script src="frontend-cadastro.js"></script>
</body>
</html>
